name: Build Minecraft Java Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build Android launcher from Amethyst source
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Checkout Amethyst Android source with submodules
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          submodules: recursive
          path: amethyst-source

      - name: Make Gradle wrapper executable
        working-directory: amethyst-source
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: amethyst-source
        run: ./gradlew --no-daemon --stacktrace :app_pojavlauncher:assembleDebug

      - name: Verify APK exists
        run: |
          set -euo pipefail
          find amethyst-source/app_pojavlauncher/build/outputs/apk -type f -name '*.apk' -print
          APK=$(find amethyst-source/app_pojavlauncher/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-java-pc-style-launcher-apk
          path: amethyst-source/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
